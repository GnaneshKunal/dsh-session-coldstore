name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite and node:zlib zstd are the floor: both land on 22.19.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and no lockfile: the plugin is plain ESM over Node builtins,
      # so there is nothing to install.
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
